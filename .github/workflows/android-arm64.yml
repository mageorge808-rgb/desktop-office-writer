name: Build Writer APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloud/**', 'scripts/**', 'tests/**', 'prebuilt.lock.json', '.github/workflows/**', 'android/common/src/main/res/drawable/office_icon.xml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: writer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/build-writer-cloud.sh
  apk:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install redistributable document fonts on the cloud runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core fontconfig
      - uses: actions/cache@v4
        with:
          path: build/signing/writer-development.jks
          key: writer-development-signing-v1
      - run: bash scripts/build-writer-cloud.sh
      - name: Enable free hosted-runner Android virtualization
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android DOCX edit and save tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 13's x86 image lacks ARM translation. Android 15's Google
          # image provides it and a modern WebView; test the shipping ARM64 APK.
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -skin 1280x854 -camera-back none
          script: bash scripts/emulator-smoke.sh
      - name: Preserve Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-native-test-diagnostics
          path: build/apk/device-test/
          retention-days: 1
          if-no-files-found: ignore
      - name: Publish a persistent direct APK download after tests pass
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_REPOSITORY: ${{ github.repository }}
        run: |
          tag="writer-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          tar -czf build/apk/font-licenses.tar.gz -C build/apk font-licenses
          cat > "$RUNNER_TEMP/writer-release.md" <<EOF
          Tested development build for ARM64 Android tablets, with a desktop Writer ribbon and offline DOCX editing.

          Download **Desktop-Office-Writer-arm64.apk** below and install it. The APK link does not use the one-day Actions artifact retention.

          The cloud checks passed DOCX open/edit/table insertion/save/reopen/read-only handling, native keyboard typing with Ctrl+B/Ctrl+S/Ctrl+Alt+T, page rendering, representative Noto/DejaVu font enumeration, and full-width Home formatting controls. These are targeted smoke checks, not certification of all Word features or physical Pad 7 input.

          Known issue: black document table borders still have poor contrast on a dark page. The table-picker contrast is improved; saved document borders keep their original colours.

          Updates use the cached development signing key. This build retains com.collabora.libreoffice and cannot update the officially signed Collabora app.

          Source commit: ${GITHUB_SHA}
          Build and diagnostics: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Engine provenance, font licenses, checksums and modified source are attached below.
          EOF
          mapfile -d '' -t assets < <(find build/apk -maxdepth 1 -type f -print0)
          gh release create "$tag" "${assets[@]}" --repo "$WRITER_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Writer development build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/writer-release.md" --latest
          echo "Direct APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/Desktop-Office-Writer-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the latest Writer artifact within the free storage allowance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/artifacts" --jq '.artifacts[] | select(.name == "desktop-office-writer-arm64") | .id' |
          while read -r artifact; do
            gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-office-writer-arm64
          path: |
            build/apk/*
            !build/apk/device-test/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Download instructions
        run: |
          echo '### Writer APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **desktop-office-writer-arm64** from Artifacts, unzip it, and install Desktop-Office-Writer-arm64.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Development build: retains the upstream package ID; back up documents and uninstall official Collabora first. Physical-input acceptance tests remain required.' >> "$GITHUB_STEP_SUMMARY"

